# Ubuntu/Debian: /etc/nginx/sites-available/site-sv, included inside the http {} context.
# Replace example.com. Configure TLS with Certbot before using the editor.
limit_req_zone $binary_remote_addr zone=site_sv_login:10m rate=5r/m;

server {
    listen 80;
    server_name example.com;
    client_max_body_size 512k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_buffering off;

    location ~ ^/api/login/?$ {
        limit_req zone=site_sv_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

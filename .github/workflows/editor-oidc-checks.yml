name: Editor SSO checks
on:
  push:
    paths:
      - 'lib/editor-oidc.ts'
      - 'lib/editor-oidc-cookies.ts'
      - 'lib/auth.ts'
      - 'components/Login.tsx'
      - 'components/Editor.tsx'
      - 'app/edit/page.tsx'
      - 'app/api/editor-oidc/**'
      - 'app/api/login/**'
      - 'app/api/logout/**'
      - 'next.config.ts'
      - 'scripts/test-security.mjs'
      - 'scripts/test-editor-oidc.mjs'
      - '.env.example'
      - 'docs/AUTH_208_EDITOR_OIDC.md'
      - '.github/workflows/editor-oidc-checks.yml'
  pull_request:
    paths:
      - 'lib/editor-oidc.ts'
      - 'lib/editor-oidc-cookies.ts'
      - 'lib/auth.ts'
      - 'components/Login.tsx'
      - 'components/Editor.tsx'
      - 'app/edit/page.tsx'
      - 'app/api/editor-oidc/**'
      - 'app/api/login/**'
      - 'app/api/logout/**'
      - 'next.config.ts'
      - 'scripts/test-security.mjs'
      - 'scripts/test-editor-oidc.mjs'
      - '.env.example'
      - 'docs/AUTH_208_EDITOR_OIDC.md'
      - '.github/workflows/editor-oidc-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run test:oidc

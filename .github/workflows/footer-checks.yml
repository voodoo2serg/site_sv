name: Personal site footer checks
on:
  push:
    branches: [main]
    paths:
      - 'components/Shell.tsx'
      - 'app/globals.css'
      - 'public/assets/projects/**'
      - 'scripts/test-footer.mjs'
      - '.github/workflows/footer-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify footer structure, links and project assets
        run: node scripts/test-footer.mjs
      - name: Typecheck
        run: npm run check
      - name: Build Next.js for VPS
        run: npm run build:vps
